name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Throwaway database for the migration check below; nothing else connects anywhere.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      PAYLOAD_SECRET: ci-placeholder-not-a-secret-000000000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      # Migrations apply on an empty database, and the audit log rejects UPDATE and DELETE
      # (F-018 CA-4, CA-6).
      - run: pnpm migrate
      - name: Audit log is append-only
        env:
          PGPASSWORD: ci
        run: |
          q() { psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -qtAc "$1"; }
          q "INSERT INTO audit_log (at, entity, action) VALUES (now(), 'settings', 'update')"
          if q "UPDATE audit_log SET locale = 'es'"; then echo "UPDATE was allowed"; exit 1; fi
          if q "DELETE FROM audit_log"; then echo "DELETE was allowed"; exit 1; fi
          echo "audit_log rejects UPDATE and DELETE"
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const rows = ["statements","branches","functions","lines"]
              .map(k => `| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`).join("\n");
            console.log(`### Unit test coverage\n\n| Metric | Coverage |\n|---|---|\n${rows}`);
          ' >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
