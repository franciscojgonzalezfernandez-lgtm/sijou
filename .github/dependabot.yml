version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    ignore:
      # Types must match the Node.js runtime (24 LTS, see .nvmrc); bump together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns:
          ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@axe-core/*", "@lhci/*"]
      lint:
        patterns:
          ["eslint", "eslint-*", "typescript-eslint", "prettier", "prettier-*", "typescript"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
